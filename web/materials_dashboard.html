<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SRTP 素材仪表盘 — 按章节排列</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050B1F;color:#e8eaed;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;line-height:1.6} :root{--accent:#22D3EE;--blue:#3B82F6;--indigo:#6366F1}
.container{max-width:1300px;margin:0 auto;padding:16px}

/* ── Section divider ── */
.chapter{border-left:4px solid #38bdf8;margin:36px 0 0;padding-left:0;background:#111827;border-radius:0 12px 12px 0;overflow:hidden}
.chapter.alt{border-left-color:#a78bfa}
.chapter.alt2{border-left-color:#22c55e}
.chapter-header{padding:18px 24px;background:#1e293b;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}
.chapter-header h2{font-size:1.2rem;font-weight:700}
.chapter-header .badge{font-size:0.68rem;padding:4px 12px;border-radius:12px;background:#1e3a5f;color:#38bdf8;white-space:nowrap}
.chapter-body{padding:20px 24px}
.chapter-hint{font-size:0.7rem;color:var(--accent);background:rgba(34,211,238,0.08);padding:6px 14px;border-radius:6px;margin-bottom:16px;display:inline-block}

/* ── Stat cards ── */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:18px 16px;text-align:center}
.stat-card .num{font-size:1.8rem;font-weight:800;color:#38bdf8;line-height:1.1}
.stat-card .num.gr{color:#22c55e}
.stat-card .num.am{color:var(--accent)}
.stat-card .lbl{font-size:0.75rem;color:#94a3b8;margin-top:4px}
.stat-card .sub{font-size:0.65rem;color:#475569;margin-top:2px}

/* ── Tables ── */
.tbl{width:100%;border-collapse:collapse;font-size:0.82rem}
.tbl th{text-align:left;padding:8px 12px;background:#0f172a;color:#64748b;font-weight:600;font-size:0.72rem;border-bottom:2px solid #1e293b}
.tbl td{padding:8px 12px;border-bottom:1px solid #0f172a}
.tbl tr:hover{background:rgba(56,189,248,0.04)}
.tbl .hi{color:#38bdf8;font-weight:700}

/* ── Link cards ── */
.link-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.link-card{background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:16px;transition:all 0.2s;text-decoration:none;color:#e2e8f0;display:block}
.link-card:hover{border-color:#38bdf8;transform:translateY(-2px)}
.link-card .ic{font-size:1.3rem;margin-bottom:6px}
.link-card h4{font-size:0.88rem;color:#38bdf8;margin-bottom:4px}
.link-card .dsc{font-size:0.7rem;color:#64748b}
.link-card .ch{font-size:0.6rem;color:#334155;margin-top:6px}

/* ── Bars ── */
.bar-row{margin:6px 0}
.bar-lbl{display:flex;justify-content:space-between;font-size:0.73rem;color:#94a3b8;margin-bottom:2px}
.bar-bg{background:#0f172a;border-radius:4px;height:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}

/* ── Compare cards ── */
.cmp-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.cmp-card{background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:20px 16px;text-align:center}
.cmp-card.best{border-color:#22c55e;box-shadow:0 0 16px rgba(34,197,94,0.1)}
.cmp-card h5{font-size:0.8rem;color:#94a3b8;margin-bottom:10px}
.cmp-card .m{font-size:1.5rem;font-weight:700;color:#38bdf8}
.cmp-card.best .m{color:#22c55e}
.cmp-card .m2{font-size:0.9rem;font-weight:600;color:#94a3b8}
.cmp-card .tag{display:inline-block;font-size:0.65rem;padding:3px 10px;border-radius:10px;margin-top:8px;background:#1e3a5f;color:#38bdf8}
.cmp-card.best .tag{background:#14532d;color:#22c55e}

/* ── Year chart ── */
.yr-chart{display:flex;align-items:flex-end;gap:2px;height:180px;padding:8px 0;overflow-x:auto}
.yr-col{flex-shrink:0;text-align:center;font-size:0.55rem;color:#64748b}
.yr-col .cnt{font-size:0.6rem;color:#e2e8f0}
.yr-col .bar{width:18px;border-radius:3px 3px 0 0;margin:3px auto 0;opacity:0.85;min-height:2px}

/* ── Details tree ── */
.tree details{margin:2px 0}
.tree summary{cursor:pointer;color:#cbd5e1;font-size:0.82rem;padding:2px 0}
.tree summary:hover{color:#38bdf8}
.tree .l1>summary{color:#38bdf8;font-size:0.9rem;font-weight:600}
.tree .l2>summary{color:#94a3b8;font-size:0.82rem}
.tree .l3{color:#64748b;font-size:0.75rem;margin-left:44px;padding:1px 0}

/* ── Misc ── */
.flex2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.flex2{grid-template-columns:1fr}.cmp-row{grid-template-columns:1fr}}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.toc a{color:#64748b;text-decoration:none;font-size:0.72rem;padding:5px 12px;border:1px solid #1e293b;border-radius:16px}
.toc a:hover{color:#38bdf8;border-color:#38bdf8}
.footer{text-align:center;padding:30px;color:#334155;font-size:0.7rem;margin-top:40px;border-top:1px solid #111827}
.loading{text-align:center;padding:60px;color:#475569}
.loading .spin{width:28px;height:28px;border:3px solid #1e293b;border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#f87171;background:rgba(99,102,241,0.08);padding:16px;border-radius:8px;font-size:0.82rem}
.fn{font-family:monospace;font-size:0.75rem}
</style>
</head>
<body>

<div style="background:linear-gradient(135deg,#1e293b 0%,#0b1120 50%,#1e1b4b 100%);padding:32px 20px;text-align:center;border-bottom:2px solid #38bdf8">
  <h1 style="font-size:1.7rem;color:#38bdf8">🤖 机器人柔性磨削知识库 — SRTP 素材仪表盘</h1>
  <p style="color:#64748b;font-size:0.82rem;margin-top:6px">按结题报告 §一～§七 顺序排列 · 每个板块可独立截屏用于 Word/PPT</p>
  <div style="margin-top:14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
    <span style="background:#0f172a;border:1px solid #22c55e;color:#22c55e;padding:4px 14px;border-radius:14px;font-size:0.72rem" id="hdrTotal">--</span>
    <span style="background:#0f172a;border:1px solid #38bdf8;color:#38bdf8;padding:4px 14px;border-radius:14px;font-size:0.72rem" id="hdrClass">--</span>
    <span style="background:#0f172a;border:1px solid #a78bfa;color:#a78bfa;padding:4px 14px;border-radius:14px;font-size:0.72rem" id="hdrYear">--</span>
  </div>
</div>

<div class="container">

<div class="toc">
  <a href="#s1">§一 目的意义</a>
  <a href="#s2">§二 创新点</a>
  <a href="#s3">§三 主要内容</a>
  <a href="#s4">§四 过程方法</a>
  <a href="#s5">§五 完成情况</a>
  <a href="#s6">§六 成果简介</a>
  <a href="#s7">§七 分析总结</a>
  <a href="#sx">§八 问题建议</a>
</div>

<div id="loading" class="loading"><div class="spin"></div>正在从 JSON 提取数据...</div>
<div id="app" style="display:none"></div>
<div class="footer">数据实时提取 · papers_enriched_updated.json (1175篇) · 刷新页面即可更新</div>

<script>
async function loadJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(`${u} ${r.status}`);return r.json()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function main(){
try{
const[P,ST,EX,CI,CF]=await Promise.all([
  loadJSON('papers_enriched_updated.json'),
  loadJSON('mindmap_stats.json'),
  loadJSON('experiment_results.json'),
  loadJSON('category_index.json'),
  loadJSON('conferences/conferences.json')
]);
const T=P.length;
const wSum=P.filter(p=>(p.summary_zh||'').trim()).length;
const wAbs=P.filter(p=>(p.abstract||'').trim()).length;
const wDOI=P.filter(p=>(p.doi||'').trim()).length;
const cla=P.filter(p=>{const h=p.hierarchy||{};return[].concat(h.process_domain||[],h.process_method||[],h.research_topic||[],h.application||[],h.material||[]).length>0}).length;

// Year map
const yM={};P.forEach(p=>{const y=p.year;if(y&&String(y).match(/^\d{4}$/)){const yi=+y;yM[yi]=(yM[yi]||0)+1}});
const yrs=Object.keys(yM).map(Number).sort((a,b)=>a-b);
const yMin=yrs[0],yMax=yrs[yrs.length-1],yMaxCnt=Math.max(...Object.values(yM));
const r5=yrs.filter(y=>y>=2022).reduce((s,y)=>s+yM[y],0);

// Header
document.getElementById('hdrTotal').textContent=`📊 ${T} 篇论文`;
document.getElementById('hdrClass').textContent=`🏷️ ${(cla/T*100).toFixed(0)}% 已分类`;
document.getElementById('hdrYear').textContent=`📅 ${yMin}-${yMax}`;

// ==================== HELPERS ====================
function statRow(cards){return `<div class="stat-row">${cards.map(c=>`<div class="stat-card"><div class="num ${c.cl||''}">${c.v}</div><div class="lbl">${c.l}</div><div class="sub">${c.s||''}</div></div>`).join('')}</div>`}
function bar(lbl,v,max,cl='#38bdf8'){const pct=max>0?Math.round(v/max*100):0;return`<div class="bar-row"><div class="bar-lbl"><span>${lbl}</span><span>${v} (${pct}%)</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${cl}"></div></div></div>`}
function hint(t){return`<div class="chapter-hint">📸 截屏范围：${t}</div>`}
function tbl(hd,rows){return`<table class="tbl"><tr>${hd.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="hi"':''}>${c}</td>`).join('')}</tr>`).join('')}</table>`}

// ==================== §一 目的意义 ====================
let h='';
h+=`<div class="chapter" id="s1"><div class="chapter-header"><h2>§一 项目研究的目的、意义</h2><span class="badge">截屏用于报告 §一</span></div><div class="chapter-body">`;
h+=hint('从顶部统计卡片截到年份分布文字结束 — 展示项目整体规模');
h+=statRow([
  {v:T,l:'论文总数',s:'去重后（已删除72篇无关）',cl:'gr'},
  {v:'100%',l:'分类覆盖率',s:`${cla}/${T}篇已标注五维层级`},
  {v:wSum,l:'中文摘要',s:`${(wSum/T*100).toFixed(1)}% 已覆盖`},
  {v:wAbs,l:'英文摘要',s:`${(wAbs/T*100).toFixed(1)}%`},
  {v:`${yMin}-${yMax}`,l:'时间跨度',s:`近5年 ${r5}篇 (${(r5/T*100).toFixed(0)}%)`},
  {v:81,l:'分类路径',s:`6维度 × 81条path`,cl:'am'},
]);
h+=`<p style="color:#64748b;font-size:0.73rem;margin-top:8px">🔗 配套大图：<a href="index.html" target="_blank" style="color:#38bdf8">index.html 主页 Hero 区</a>（粒子动画+标题，适合展示领域背景）</p>`;
h+=`</div></div>`;

// ==================== §二 创新点 ====================
h+=`<div class="chapter alt" id="s2"><div class="chapter-header"><h2>§二 项目创新点（4个创新点）</h2><span class="badge" style="background:#1e1b4b;color:#a78bfa">截屏用于报告 §二</span></div><div class="chapter-body">`;
h+=hint('截取：五维分类树 + 三策略对比卡片 + 可视化全家福链接');

h+=`<h4 style="color:#38bdf8;margin-bottom:10px;font-size:0.9rem">创新点1：五维结构化知识分类体系</h4>`;
h+=`<div class="tree">`;
(ST.process_tree||[]).forEach(l1=>{
  h+=`<details class="l1" open><summary>${l1.name} (${l1.count}篇)</summary>`;
  (l1.children||[]).forEach(l2=>{
    h+=`<details class="l2" style="margin-left:20px"><summary>${l2.name} (${l2.count}篇)</summary>`;
    (l2.children||[]).forEach(l3=>{h+=`<div class="l3">▸ ${l3.name} (${l3.count}篇)</div>`});
    h+=`</details>`;
  });
  h+=`</details>`;
});
h+=`</div>`;
h+=`<p style="color:#64748b;font-size:0.7rem;margin-top:8px">🔗 配套大图：<a href="mindmaps.html" target="_blank" style="color:#38bdf8">mindmaps.html 可拖拽展开的完整五维分类导图</a></p>`;

h+=`<h4 style="color:#38bdf8;margin:20px 0 10px;font-size:0.9rem">创新点2：基于领域分类的结构化混合检索策略</h4>`;
const s=EX.summary;
h+=`<div class="cmp-row">
  <div class="cmp-card"><h5>朴素 BM25（基线）</h5><div class="m2">Recall@5</div><div class="m">${(s.naive.recall5*100).toFixed(1)}%</div><div class="m2">MRR ${s.naive.mrr.toFixed(3)}</div><div class="tag">基线</div></div>
  <div class="cmp-card"><h5>结构化过滤</h5><div class="m2">Recall@5</div><div class="m">${(s.structured.recall5*100).toFixed(1)}%</div><div class="m2">MRR ${s.structured.mrr.toFixed(3)}</div><div class="tag">分类过滤+BM25</div></div>
  <div class="cmp-card best"><h5>⭐ 混合检索（最优）</h5><div class="m2">Recall@5</div><div class="m">${(s.hybrid.recall5*100).toFixed(1)}%</div><div class="m2">MRR ${s.hybrid.mrr.toFixed(3)}</div><div class="tag" style="background:#14532d;color:#22c55e">↑ ${EX.improvement}% vs 基线</div></div>
</div>`;
h+=tbl(['问题类型','朴素 BM25 Recall@5','混合检索 Recall@5','提升幅度'],Object.entries(EX.by_type).map(([qt,vals])=>{
  const na=vals.naive*100,hy=vals.hybrid*100,impr=na>0?((hy-na)/na*100):0;
  return [`${qt}`,`${na.toFixed(1)}%`,`${hy.toFixed(1)}%`,`${impr>0?'+':''}${impr.toFixed(0)}%`];
}));
h+=`<p style="color:#64748b;font-size:0.7rem;margin-top:8px">🔗 配套大图：<a href="experiment.html" target="_blank" style="color:#38bdf8">experiment.html 实验数据页</a></p>`;

h+=`<h4 style="color:#38bdf8;margin:20px 0 10px;font-size:0.9rem">创新点4：多维知识可视化探索系统（6种交互式工具）</h4>`;
const vis=[
  ['🧠','知识库检索主页','粒子动画Hero+3D星球+三栏检索','index.html'],
  ['🗺️','vis-network层级导图','可拖拽展开的五维分类导图','mindmaps.html'],
  ['🌳','D3径向知识图谱','放射状层级结构，可展开/收缩','radial.html'],
  ['🌐','ECharts径向树','基于ECharts的交互式分类树','d3_mindmap.html'],
  ['🌌','3D知识星系','Three.js粒子星系，论文按分类着色','galaxy.html'],
  ['🌍','3D会议地球+时间轴','地球标注会议举办地+历年趋势','timeline.html'],
];
h+=`<div class="link-row">${vis.map(v=>`<a class="link-card" href="${v[3]}" target="_blank"><div class="ic">${v[0]}</div><h4>${v[1]}</h4><div class="dsc">${v[2]}</div></a>`).join('')}</div>`;
h+=`</div></div>`;

// ==================== §三 主要内容 ====================
h+=`<div class="chapter alt2" id="s3"><div class="chapter-header"><h2>§三 项目研究的主要内容</h2><span class="badge" style="background:#0a2a1a;color:#22c55e">截屏用于报告 §三</span></div><div class="chapter-body">`;
h+=hint('分3段截：(1)年份分布图 (2)期刊表 (3)应用场景/材料分布。每段对应一个子主题。');

h+=`<h4 style="color:#22c55e;margin-bottom:10px;font-size:0.9rem">子主题1：知识库构建 — 论文年份分布</h4>`;
let yrHTML=`<div class="yr-chart">`;
for(let y=yMin;y<=yMax;y++){const cnt=yM[y]||0;const hPx=Math.max(2,Math.round(cnt/yMaxCnt*160));yrHTML+=`<div class="yr-col"><div class="cnt">${cnt||''}</div><div class="bar" style="height:${hPx}px;background:${y>=2022?'#22c55e':'#38bdf8'};opacity:${cnt>0?0.85:0.15}"></div><div>${y}</div></div>`}
yrHTML+=`</div><p style="text-align:center;color:#64748b;font-size:0.73rem;margin-top:6px">峰值：${Object.entries(yM).sort((a,b)=>b[1]-a[1])[0][1]}篇 (${Object.entries(yM).sort((a,b)=>b[1]-a[1])[0][0]}年) · 近5年：${r5}篇 (${(r5/T*100).toFixed(0)}%)</p>`;
h+=yrHTML;

h+=`<h4 style="color:#22c55e;margin:20px 0 10px;font-size:0.9rem">子主题1：期刊/会议生态 — TOP10</h4>`;
h+=tbl(['#','简称','全称','论文数','年份','主要方向'],[...CF.journals].sort((a,b)=>b.paper_count-a.paper_count).slice(0,10).map((j,i)=>[i+1,j.abbrev,esc(j.full_name).substring(0,40),j.paper_count,j.year_range||'',(j.top_directions||[]).slice(0,2).map(d=>d.name).join(', ')]));
h+=`<p style="color:#64748b;font-size:0.7rem;margin-top:6px">期刊 ${CF.total_journals} 个 · 会议 ${CF.total_conferences} 个 · 总计 ${CF.total_venues} 个收录源</p>`;

h+=`<h4 style="color:#22c55e;margin:20px 0 10px;font-size:0.9rem">子主题2：五维分类 — L4应用场景 + L5加工材料</h4>`;
h+=`<div class="flex2"><div>`;
h+=`<h5 style="color:#94a3b8;font-size:0.78rem;margin-bottom:8px">L4 应用场景</h5>`;
(ST.application||[]).forEach(a=>h+=bar(a.name,a.count,(ST.application||[])[0].count,'#a78bfa'));
h+=`</div><div>`;
h+=`<h5 style="color:#94a3b8;font-size:0.78rem;margin-bottom:8px">L5 加工材料</h5>`;
(ST.material||[]).forEach(m=>h+=bar(m.name,m.count,(ST.material||[])[0].count,'#f472b6'));
h+=`</div></div>`;

h+=`<h4 style="color:#22c55e;margin:20px 0 10px;font-size:0.9rem">子主题4：可视化系统 — 配套页面</h4>`;
h+=`<p style="color:#64748b;font-size:0.75rem">6个独立页面 + 1个主页 + 1个搜索页 + 1个实验页 + 1个仪表盘（本页）= 10个页面，全部本地化部署，零CDN依赖。</p>`;
h+=`<div class="link-row">${[
  ['🏠','index.html','知识库主页（Hero+3D+检索+时间轴）'],
  ['🔍','search.html','独立搜索页'],
  ['🧪','experiment.html','检索实验数据页'],
  ['📖','outline.html','五维大纲纯HTML页'],
].map(v=>`<a class="link-card" href="${v[1]}" target="_blank"><div class="ic">${v[0]}</div><h4>${v[1]}</h4><div class="dsc">${v[2]}</div></a>`).join('')}</div>`;
h+=`</div></div>`;

// ==================== §四 过程方法 ====================
h+=`<div class="chapter" id="s4"><div class="chapter-header"><h2>§四 项目研究过程与方法（五个阶段）</h2><span class="badge">截屏用于报告 §四</span></div><div class="chapter-body">`;
h+=hint('5个阶段各截1张：数据文件清单→分类树→实验对比→可视化链接→待同学补向量库截图');

h+=`<h4 style="color:#38bdf8;margin-bottom:10px;font-size:0.9rem">第一阶段：文献调研与数据采集 → 数据文件全景</h4>`;
h+=tbl(['数据文件','用途','规模'],[
  ['papers_enriched_updated.json','主数据（全字段）',`${T}篇完整元数据`],
  ['papers_classified.json','前端检索切片',`${T}篇精简字段`],
  ['papers_index.json','按ID查询',`${T}篇 by_id索引`],
  ['category_index.json','分类索引','81条path × 6维度'],
