<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>3D 知识星系 — Dark Neural System</title>
  <style>
    :root { --bg: #050B1F; --cyan: #22D3EE; --blue: #3B82F6; --indigo: #6366F1; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: #e8eaed; overflow: hidden; height: 100vh; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    canvas { display: block; }
    .topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: rgba(5,11,31,0.88); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .topbar h1 { font-size: 0.95rem; color: var(--cyan); white-space: nowrap; }
    .topbar .nav-links { display: flex; gap: 6px; }
    .topbar .nav-links a { color: #7c84a0; text-decoration: none; font-size: 0.75rem; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); transition: all 0.2s; }
    .topbar .nav-links a:hover, .topbar .nav-links a.active { color: #fff; background: rgba(34,211,238,0.08); border-color: rgba(34,211,238,0.25); }
    .legend { position: absolute; bottom: 20px; left: 16px; z-index: 100; display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.7rem; color: #7c84a0; }
    .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .hint { position: absolute; bottom: 20px; right: 20px; z-index: 100; color: #5a6080; font-size: 0.7rem; text-align: right; line-height: 1.5; }
    .card { position: absolute; top: 80px; right: 16px; width: 300px; max-height: 60vh; background: rgba(8,14,36,0.94); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 10px; padding: 14px; overflow-y: auto; display: none; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.6); font-size: 0.78rem; }
    .card.show { display: block; }
    .card h3 { font-size: 0.9rem; color: var(--cyan); margin-bottom: 4px; }
    .card .meta { color: #7c84a0; font-size: 0.7rem; margin-bottom: 6px; }
    .card .kws { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
    .card .kws span { background: rgba(34,211,238,0.1); color: var(--cyan); padding: 2px 6px; border-radius: 3px; font-size: 0.68rem; }
    .card .links { display: flex; gap: 6px; margin-bottom: 6px; }
    .card .links a { background: var(--blue); color: #fff; padding: 3px 8px; border-radius: 4px; text-decoration: none; font-size: 0.7rem; font-weight: 600; }
    .card .summary { color: #b0b8d0; font-size: 0.73rem; line-height: 1.5; }
    .card .close-btn { position: absolute; top: 6px; right: 10px; background: none; border: none; color: #7c84a0; cursor: pointer; font-size: 1rem; }
    #bgParticles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.5}
  </style>
</head>
<body>
<canvas id="bgParticles"></canvas>
  <div class="topbar">
    <h1>🌌 3D 知识星系</h1>
    <div class="nav-links">
      <a href="index.html" style="font-weight:700;color:var(--cyan);border-color:rgba(34,211,238,0.25)">← 返回主页</a>
      <span style="color:rgba(255,255,255,0.15);margin:0 4px">|</span>
      <a href="d3_mindmap.html">🧠 D3径向</a>
      <a href="mindmaps.html">📊 层级</a>
      <a href="radial.html">🎯 ECharts</a>
      <a href="galaxy.html" class="active">🌌 星系</a>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="hint">🖱 拖拽旋转 · 滚轮缩放 · 点击星球看论文</div>
  <div class="card" id="card">
    <button class="close-btn" id="closeCard">✕</button>
    <div id="cardContent"></div>
  </div>
  <script src="three.min.js"></script>
  <script src="galaxy.js?v=1"></script>
<script>
// ═══════════ PARTICLE SYSTEM v2.0 ═══════════
(function(){var c=document.getElementById("bgParticles"),ctx=c.getContext("2d"),pts=[],mx=0,my=0,tmx=0,tmy=0;function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener("resize",rs);document.addEventListener("mousemove",function(e){tmx=e.clientX;tmy=e.clientY});mx=window.innerWidth/2;my=window.innerHeight/2;tmx=mx;tmy=my;var pal=[{r:59,g:130,b:246,a:0.6},{r:99,g:102,b:241,a:0.5},{r:34,g:211,b:238,a:0.4},{r:37,g:99,b:235,a:0.45}];for(var i=0;i<100;i++){var col=pal[Math.floor(Math.random()*pal.length)];pts.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,r:Math.random()*1.3+0.2,col:col,ox:Math.random()*c.width,oy:Math.random()*c.height})}function dr(){mx+=(tmx-mx)*0.03;my+=(tmy-my)*0.03;ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<pts.length;i++){var p=pts[i];var dxm=p.x-mx,dym=p.y-my,dm=Math.sqrt(dxm*dxm+dym*dym);var parallax=dm<300?(1-dm/300)*0.1:0;var nx=dm>0.1?dxm/dm:0,ny=dm>0.1?dym/dm:0;p.vx+=nx*parallax*0.02;p.vy+=ny*parallax*0.02;p.vx*=0.999;p.vy*=0.999;p.vx+=(p.ox-p.x)*0.00003;p.vy+=(p.oy-p.y)*0.00003;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba("+p.col.r+","+p.col.g+","+p.col.b+","+p.col.a+")";ctx.fill()}for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle="rgba(79,130,210,"+(0.03*(1-dist/100))+")";ctx.lineWidth=0.25;ctx.stroke()}}}requestAnimationFrame(dr)}dr()})();
</script>
</body>
</html>
