<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>学术会议与期刊 — Dark Neural System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    /* ═══════════════ DESIGN SYSTEM v2.0 ═══════════════ */
    :root {
      --bg-deep: #050B1F;
      --bg-card: rgba(255,255,255,0.03);
      --text: #e8eaed;
      --muted: #7c84a0;
      --accent: #2563EB;
      --cyan: #22D3EE;
      --indigo: #6366F1;
      --border: rgba(255,255,255,0.08);
      --border-glow: rgba(34,211,238,0.25);
    }
    *{box-sizing:border-box}
    body{background:var(--bg-deep);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;color:var(--text)}
    .hero{background:linear-gradient(135deg,#060f2b,#0f1b3b,#2563EB);color:#fff;padding:20px 16px;text-align:center;border-bottom:1px solid var(--border)}
    .hero h1{font-size:1.2rem;margin:0 0 4px;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero p{opacity:.75;font-size:.78rem;margin:0}
    .hero a{color:var(--cyan);text-decoration:none;font-size:.75rem;display:inline-block;margin-top:4px;padding:4px 12px;border:1px solid rgba(34,211,238,0.25);border-radius:6px;transition:all 0.2s}
    .hero a:hover{background:rgba(34,211,238,0.1)}
    .container{max-width:1200px;margin:0 auto;padding:14px}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .stat-card{background:var(--bg-card);border-radius:8px;padding:12px 18px;border:1px solid var(--border);text-align:center;flex:1;min-width:80px;transition:all 0.2s}
    .stat-card:hover{border-color:var(--border-glow)}
    .stat-card .num{font-size:1.3rem;font-weight:700;color:var(--cyan)}
    .stat-card .lbl{font-size:.68rem;color:var(--muted)}
    .tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid rgba(255,255,255,0.06)}
    .tabs button{padding:8px 20px;border:none;background:none;font-size:.85rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
    .tabs button.on{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:600}
    .tabs button .badge{background:rgba(255,255,255,0.06);color:var(--muted);font-size:.7rem;padding:1px 7px;border-radius:10px;margin-left:4px}
    .tabs button.on .badge{background:rgba(34,211,238,0.1);color:var(--cyan)}
    .search-wrap{margin-bottom:12px}
    .search-wrap input{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;outline:none;background:rgba(255,255,255,0.03);color:var(--text);transition:all 0.2s}
    .search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,0.1)}
    .search-wrap input::placeholder{color:rgba(255,255,255,0.2)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:12px}
    .vcard{background:var(--bg-card);border-radius:10px;padding:16px;cursor:pointer;border:1px solid var(--border);transition:all .2s}
    .vcard:hover{border-color:var(--border-glow);box-shadow:0 4px 16px rgba(34,211,238,0.06);transform:translateY(-1px)}
    .vcard.on{border-color:var(--cyan);background:rgba(34,211,238,0.04)}
    .vcard .abbrev{font-size:1.05rem;font-weight:700;color:var(--cyan)}
    .vcard .fullname{font-size:.75rem;color:var(--muted);margin:1px 0 5px}
    .vcard .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.7rem;color:var(--muted);margin-bottom:6px}
    .vcard .trend-line{font-size:.7rem;color:#34d399;margin-bottom:4px}
    .vcard .dirs{display:flex;flex-wrap:wrap;gap:3px}
    .vcard .dirs .tag{background:rgba(34,211,238,0.06);color:var(--cyan);font-size:.65rem;padding:2px 7px;border-radius:4px}
    .detail-wrap{display:none;margin-top:14px}
    .detail-wrap.on{display:block}
    .detail{background:var(--bg-card);border-radius:10px;padding:22px;border:1px solid var(--border)}
    .detail .d-abbrev{font-size:1.4rem;font-weight:800;color:var(--cyan)}
    .detail h2{font-size:1.05rem;color:var(--text);margin:2px 0 6px}
    .detail .d-meta{color:var(--muted);font-size:.78rem;margin-bottom:4px}
    .detail .d-meta a{color:var(--cyan);text-decoration:none}
    .detail .d-summary{background:rgba(34,211,238,0.03);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:.8rem;color:var(--muted);border-left:3px solid var(--cyan)}
    .kw-table{width:100%;font-size:0.7rem;border-collapse:collapse;margin-top:6px}
    .kw-table th{background:rgba(255,255,255,0.03);padding:4px 8px;text-align:left;border-bottom:2px solid rgba(255,255,255,0.08);color:var(--muted)}
    .kw-table td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text)}
    .paper-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;transition:all .12s}
    .paper-card:hover{border-color:var(--border-glow);background:rgba(34,211,238,0.03)}
    .paper-card .pt{font-size:.8rem;font-weight:600;color:var(--cyan);margin-bottom:2px}
    .paper-card .pm{font-size:.68rem;color:var(--muted)}
    .paper-card .pk{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
    .paper-card .pk .kw{background:rgba(255,255,255,0.04);color:var(--muted);font-size:.63rem;padding:1px 6px;border-radius:3px}
    .paper-card .pa{font-size:.7rem;color:var(--muted);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .paper-card .pl{font-size:.66rem;margin-top:3px}.paper-card .pl a{color:var(--cyan);text-decoration:none}
    .load{text-align:center;padding:60px 20px;color:var(--muted)}
    .load .spinner-border{width:2rem;height:2rem;margin-bottom:8px;border-color:var(--cyan);border-right-color:transparent}
    #bgParticles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.5}
    .container,.hero{position:relative;z-index:1}
  </style>
</head>
<body>
<canvas id="bgParticles"></canvas>
<div class="hero">
  <h1>学术会议与期刊</h1>
  <p><a href="../index.html">← 返回主页</a></p>
</div>
<div class="container">
  <div class="load" id="loading"><div class="spinner-border"></div><div>Loading...</div><div id="loadErr" style="color:#f87171;display:none"></div></div>
  <div id="main" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs">
      <button class="on" data-tab="journals">学术期刊 <span class="badge" id="jcnt"></span></button>
      <button data-tab="conferences">学术会议 <span class="badge" id="ccnt"></span></button>
    </div>
    <div class="search-wrap"><input type="text" id="search" placeholder="Search..."/></div>
    <div class="grid" id="grid"></div>
    <div class="detail-wrap" id="detailWrap"><div class="detail" id="detail"></div></div>
  </div>
</div>
<script>
(function(){
  var data=null,venueLocs=null,currentTab="journals";
  var loading=document.getElementById("loading"),main=document.getElementById("main");

  fetch("venue_locations.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){venueLocs=d;}).catch(function(){});

  function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  function renderStats(){
    document.getElementById("stats").innerHTML=
      '<div class="stat-card"><div class="num">'+data.total_journals+'</div><div class="lbl">学术期刊</div></div>'+
      '<div class="stat-card"><div class="num">'+data.total_conferences+'</div><div class="lbl">学术会议</div></div>'+
      '<div class="stat-card"><div class="num">'+data.total_papers+'</div><div class="lbl">论文总数</div></div>'+
      '<div class="stat-card"><div class="num">3</div><div class="lbl">来源高校</div></div>';
    document.getElementById("jcnt").textContent=data.total_journals;
    document.getElementById("ccnt").textContent=data.total_conferences;
  }

  function renderCards(filter){
    var list=data[currentTab]||[];
    if(filter){var q=filter.toLowerCase();list=list.filter(function(c){return c.abbrev.toLowerCase().indexOf(q)>=0||c.full_name.toLowerCase().indexOf(q)>=0;});}
    document.getElementById("grid").innerHTML=list.length?list.map(function(c){
      return'<div class="vcard" data-id="'+c.id+'" onclick="selectVenue(\''+c.id+'\',\''+currentTab+'\')">'+
        '<div class="abbrev">'+esc(c.abbrev)+'</div>'+
        '<div class="fullname">'+esc(c.full_name)+'</div>'+
        '<div class="meta"><span>'+c.paper_count+' papers</span><span>'+c.year_range+'</span>'+(c.frequency?'<span>'+esc(c.frequency)+'</span>':'')+'</div>'+
        (c.trend_summary?'<div class="trend-line">'+esc(c.trend_summary.substring(0,80))+'</div>':'')+
        '<div class="dirs">'+(c.top_directions||[]).slice(0,6).map(function(d){return'<span class="tag">'+esc(d.name)+'</span>';}).join("")+'</div>'+
      '</div>';
    }).join(""):'<div style="color:var(--muted);text-align:center;padding:40px">No results</div>';
  }

  window.selectVenue=function(id, tab){
    var list=data[tab||currentTab]||[];
    var c=list.find(function(x){return x.id===id;});
    if(!c) return;
    document.querySelectorAll(".vcard").forEach(function(el){el.classList.toggle("on",el.dataset.id===id);});

    var locInfo=null, locHtml='';
    if(venueLocs){
      var locKey=(c.abbrev||'').toUpperCase();
      locInfo=venueLocs[locKey]||null;
      if(!locInfo){
        for(var k in venueLocs){if(venueLocs[k].name&&venueLocs[k].name.toUpperCase().indexOf(locKey)>=0){locInfo=venueLocs[k];break;}}
      }
    }
    if(locInfo&&locInfo.locations&&locInfo.locations.length>0){
      var recent=locInfo.locations[0];
      locHtml='<div class="d-meta"><b>Recent location:</b> '+esc(recent.city||'')+', '+esc(recent.country||'')+' ('+recent.year+')</div>';
      if(locInfo.locations.length>1){
        locHtml+='<div class="d-meta"><b>Past venues:</b> '+locInfo.locations.slice(0,6).map(function(l){return esc(l.city||'')+(l.year?'('+l.year+')':'');}).join('  '+String.fromCharCode(0x2192)+' ')+'</div>';
      }
      if(locInfo.frequency) locHtml+='<div class="d-meta"><b>Frequency:</b> '+esc(locInfo.frequency)+'</div>';
      if(locInfo.publisher) locHtml+='<div class="d-meta"><b>Organizer:</b> '+esc(locInfo.publisher)+'</div>';
    }

    var kwMap={}, allYears=[];
    (c.trend_data||[]).forEach(function(y){
      if(allYears.indexOf(y.year)<0) allYears.push(y.year);
      (y.top_directions||[]).forEach(function(d){
        if(!kwMap[d.name]) kwMap[d.name]={};
        kwMap[d.name][y.year]=d.count;
      });
    });
    allYears.sort();
    var kwKeys=Object.keys(kwMap).sort(function(a,b){
      var ta=0,tb=0;
      Object.values(kwMap[a]||{}).forEach(function(v){ta+=v;});
      Object.values(kwMap[b]||{}).forEach(function(v){tb+=v;});
      return tb-ta;
    });

    var kwTable='<table class="kw-table"><thead><tr><th>Keyword</th>';
    allYears.forEach(function(y){kwTable+='<th style="text-align:center;font-size:0.62rem">'+y+'</th>';});
    kwTable+='<th style="text-align:center">Total</th></tr></thead><tbody>';
    kwKeys.slice(0,12).forEach(function(kw){
      kwTable+='<tr><td><b>'+esc(kw)+'</b></td>';
      var total=0;
      allYears.forEach(function(y){
        var cnt=kwMap[kw][y]||0; total+=cnt;
        kwTable+='<td style="text-align:center;'+(cnt>0?'color:var(--cyan);font-weight:600':'color:rgba(255,255,255,0.15)')+'">'+(cnt>0?cnt:'-')+'</td>';
      });
      kwTable+='<td style="text-align:center;font-weight:700;color:var(--cyan)">'+total+'</td></tr>';
    });
    kwTable+='</tbody></table>';

    var papersHtml=(c.papers||[]).map(function(p){
      var link=p.url||(p.doi?'https://doi.org/'+p.doi.replace(/^https?:\/\/(doi\.org\/)?/i,''):'');
      return'<div class="paper-card">'+
        '<div class="pt">'+esc(p.title)+'</div>'+
        '<div class="pm">'+p.year+' | '+esc(p.authors)+'</div>'+
        '<div class="pk">'+(p.directions||[]).map(function(k){return'<span class="kw">'+esc(k)+'</span>';}).join("")+'</div>'+
        '<div class="pa">'+esc(p.abstract||"")+'</div>'+
        (link?'<div class="pl"><a href="'+esc(link)+'" target="_blank">Full text</a> | <a href="https://doi.org/'+esc(p.doi.replace(/^https?:\/\/(doi\.org\/)?/i,''))+'" target="_blank">DOI</a></div>':'')+
      '</div>';
    }).join("");

    document.getElementById("detail").innerHTML=
      '<div class="d-abbrev">'+esc(c.abbrev)+'</div>'+
      '<h2>'+esc(c.full_name)+'</h2>'+
      '<div class="d-meta"><b>'+c.paper_count+'</b> papers | '+c.year_range+' | '+(tab==="conferences"?"Conference":"Journal")+
          (c.impact_factor?' | IF: '+esc(c.impact_factor):'')+
          (c.frequency?' | '+esc(c.frequency):'')+'</div>'+
          (c.publisher?'<div class="d-meta"><b>Publisher:</b> '+esc(c.publisher)+(c.website?' | <a href="'+esc(c.website)+'" target="_blank">Website</a>':'')+'</div>':'')+
          locHtml+
          (c.scope?'<div class="d-meta" style="color:var(--muted)"><b>Scope:</b> '+esc(c.scope)+'</div>':'')+
      (c.trend_summary?'<div class="d-summary"><b>Trend:</b> '+esc(c.trend_summary)+'</div>':'')+
      '<div style="margin:8px 0"><b>Research Directions:</b> '+c.top_directions.map(function(d){return'<span class="tag">'+esc(d.name)+' ('+d.count+')</span>';}).join(" ")+'</div>'+
      '<h4 style="margin-top:14px;color:var(--text)">Keyword Trends by Year</h4>'+kwTable+
      '<h4 style="margin-top:16px;color:var(--text)">Related Papers ('+(c.papers||[]).length+')</h4>'+papersHtml;

    document.getElementById("detailWrap").classList.add("on");
    document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});
  };

  document.getElementById("tabs").addEventListener("click",function(e){
    var btn=e.target.closest("button[data-tab]");
    if(!btn) return;
    document.querySelectorAll("#tabs button").forEach(function(b){b.classList.remove("on");});
    btn.classList.add("on");
    currentTab=btn.dataset.tab;
    document.getElementById("detailWrap").classList.remove("on");
    renderCards(document.getElementById("search").value.trim());
  });

  document.getElementById("search").addEventListener("input",function(){renderCards(this.value.trim());});

  fetch("venues_unified.json",{cache:"no-store"}).catch(function(){return fetch("conferences.json",{cache:"no-store"});}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
  }).then(function(d){
    data=d; loading.style.display="none"; main.style.display="block";
    renderStats(); renderCards();
  }).catch(function(e){
    document.getElementById("loadErr").textContent="Load failed: "+e.message; document.getElementById("loadErr").style.display="block";
  });
})();
</script>
<script>
// ═══════════════════════════════════════════════════════════
// PARTICLE SYSTEM v2.0 — Dark Neural (120 particles)
// ═══════════════════════════════════════════════════════════
(function(){var c=document.getElementById("bgParticles"),ctx=c.getContext("2d"),pts=[],mx=0,my=0,tmx=0,tmy=0;function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener("resize",rs);document.addEventListener("mousemove",function(e){tmx=e.clientX;tmy=e.clientY});mx=window.innerWidth/2;my=window.innerHeight/2;tmx=mx;tmy=my;var pal=[{r:59,g:130,b:246,a:0.6},{r:99,g:102,b:241,a:0.5},{r:34,g:211,b:238,a:0.4},{r:37,g:99,b:235,a:0.45}];for(var i=0;i<120;i++){var col=pal[Math.floor(Math.random()*pal.length)];pts.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,r:Math.random()*1.4+0.25,col:col,ox:Math.random()*c.width,oy:Math.random()*c.height})}function dr(){mx+=(tmx-mx)*0.03;my+=(tmy-my)*0.03;ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<pts.length;i++){var p=pts[i];var dxm=p.x-mx,dym=p.y-my,dm=Math.sqrt(dxm*dxm+dym*dym);var parallax=dm<300?(1-dm/300)*0.12:0;var nx=dm>0.1?dxm/dm:0,ny=dm>0.1?dym/dm:0;p.vx+=nx*parallax*0.02;p.vy+=ny*parallax*0.02;p.vx*=0.999;p.vy*=0.999;p.vx+=(p.ox-p.x)*0.00003;p.vy+=(p.oy-p.y)*0.00003;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba("+p.col.r+","+p.col.g+","+p.col.b+","+p.col.a+")";ctx.fill();if(p.r>0.9){ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);ctx.fillStyle="rgba("+p.col.r+","+p.col.g+","+p.col.b+","+(p.col.a*0.1)+")";ctx.fill()}}for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle="rgba(79,130,210,"+(0.035*(1-dist/100))+")";ctx.lineWidth=0.3;ctx.stroke()}}}requestAnimationFrame(dr)}dr()})();
</script>
</body>
</html>
