<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>径向思维导图 — 机器人柔性磨削知识库</title>
  <style>
    :root {
      --bg: #050B1F;
      --panel-bg: rgba(255,255,255,0.03);
      --text: #e8eaed;
      --muted: #7c84a0;
      --accent: #22D3EE;
      --blue: #3B82F6;
      --indigo: #6366F1;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* 顶栏 */
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: var(--panel-bg); border-bottom: 1px solid #334155;
      z-index: 100; flex-shrink: 0; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 1rem; white-space: nowrap; color: var(--accent); }
    .topbar .nav-links { display: flex; gap: 6px; }
    .topbar .nav-links a {
      color: var(--muted); text-decoration: none; font-size: 0.78rem;
      padding: 4px 10px; border-radius: 4px; border: 1px solid #334155;
      transition: all 0.2s;
    }
    .topbar .nav-links a:hover, .topbar .nav-links a.active {
      color: #fff; background: #334155; border-color: #475569;
    }
    /* 搜索框 */
    .search-wrap { position: relative; margin-left: auto; }
    .search-wrap input {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      color: #e2e8f0; padding: 6px 32px 6px 10px; font-size: 0.82rem;
      width: 200px; transition: all 0.2s; outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); width: 260px; }
    .search-wrap .search-icon {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 0.85rem; pointer-events: none;
    }
    .search-results {
      position: absolute; top: 100%; right: 0; width: 280px; max-height: 300px;
      overflow-y: auto; background: var(--panel-bg); border: 1px solid #334155;
      border-radius: 6px; margin-top: 4px; display: none; z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .search-results.show { display: block; }
    .search-results .sr-item {
      padding: 6px 10px; cursor: pointer; font-size: 0.78rem;
      border-bottom: 1px solid #1e293b; color: var(--text);
    }
    .search-results .sr-item:hover { background: #334155; }
    .search-results .sr-item .sr-kw { color: var(--accent); font-size: 0.72rem; }
    /* 主体 */
    .main-wrap { display: flex; flex: 1; overflow: hidden; }
    /* Tab 栏 */
    .tab-col {
      width: 48px; background: var(--panel-bg); border-right: 1px solid #334155;
      display: flex; flex-direction: column; gap: 2px; padding: 8px 4px;
      flex-shrink: 0; overflow-y: auto;
    }
    .tab-col button {
      writing-mode: vertical-lr; letter-spacing: 2px; font-size: 0.72rem;
      padding: 10px 4px; border: 1px solid transparent; border-radius: 4px;
      background: transparent; color: var(--muted); cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .tab-col button:hover { background: #334155; color: #fff; }
    .tab-col button.active { background: #1e40af; color: #fff; border-color: var(--accent); }
    /* 图表区 */
    .chart-wrap { flex: 1; position: relative; }
    #chart { width: 100%; height: 100%; }
    /* 侧边详情 */
    .detail-panel {
      position: absolute; right: 12px; top: 12px; width: 320px; max-height: calc(100% - 24px);
      background: var(--panel-bg); border: 1px solid #334155; border-radius: 8px;
      padding: 16px; overflow-y: auto; display: none; z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-size: 0.82rem;
    }
    .detail-panel.show { display: block; }
    .detail-panel h3 { font-size: 0.95rem; margin-bottom: 6px; color: #fff; }
    .detail-panel .meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 8px; }
    .detail-panel .kws { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .detail-panel .kws span {
      background: #1e40af; color: #93c5fd; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem;
    }
    .detail-panel .links { display: flex; gap: 6px; margin-bottom: 8px; }
    .detail-panel .links a {
      background: var(--accent); color: #0f172a; padding: 4px 10px; border-radius: 4px;
      text-decoration: none; font-size: 0.75rem; font-weight: 600;
    }
    .detail-panel .summary { color: #cbd5e1; font-size: 0.78rem; line-height: 1.5; }
    .detail-panel .close-btn {
      position: absolute; top: 8px; right: 10px; background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 1.1rem;
    }
    /* 图例提示 */
    .hint {
      position: absolute; bottom: 12px; left: 12px; color: var(--muted);
      font-size: 0.7rem; z-index: 10;
    }
    #bgParticles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.5}
.topbar a:hover,.topbar a.active{color:#fff;background:rgba(34,211,238,0.08);border-color:rgba(34,211,238,0.25)}
.search-wrap input{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.search-wrap input:focus{border-color:var(--cyan);width:260px}
.tab-col button:hover{background:rgba(34,211,238,0.06);color:#fff}
.tab-col button.active{background:rgba(34,211,238,0.1);color:#fff;border-color:var(--cyan)}
.detail-panel{background:rgba(8,14,36,0.95);border:1px solid var(--border)}
.detail-panel .kws span{background:rgba(34,211,238,0.1);color:var(--cyan)}
.detail-panel .links a{background:var(--blue);color:#fff}
  </style>
</head>
<body>
<canvas id="bgParticles"></canvas>
  <!-- 顶栏 -->
  <div class="topbar">
    <h1>🧠 机器人柔性磨削知识库</h1>
    <div class="nav-links">
      <a href="index.html" style="font-weight:700;color:#fff;border-color:#38bdf8">← 返回主页</a>
      <span style="color:#475569;margin:0 4px">|</span>
      <a href="d3_mindmap.html">🧠 D3径向</a>
      <a href="mindmaps.html">📊 层级导图</a>
      <a href="radial.html" class="active">🎯 ECharts径向</a>
      <a href="galaxy.html">🌌 星系</a>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="搜索论文/关键词/分类…" />
      <span class="search-icon">🔍</span>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- 主体 -->
  <div class="main-wrap">
    <!-- 左侧 Tab -->
    <div class="tab-col" id="tabCol">
      <button class="active" data-key="process_tree">工艺三级树</button>
      <button data-key="process_domain">L1 工艺领域</button>
      <button data-key="process_method">L2 工艺方式</button>
      <button data-key="research_topic">L3 研究主题</button>
      <button data-key="application">L4 应用场景</button>
      <button data-key="material">L5 加工材料</button>
    </div>
    <!-- 图表 -->
    <div class="chart-wrap">
      <div id="chart"></div>
      <div class="detail-panel" id="detailPanel">
        <button class="close-btn" id="closeDetail">✕</button>
        <div id="detailContent"></div>
      </div>
      <div class="hint">🖱 滚轮缩放 · 拖拽平移 · 点击节点展开/折叠 · 悬停看详情</div>
    </div>
  </div>

  <script src="echarts.min.js"></script>
  <script src="radial.js?v=1"></script>
<script>
// ═══════════ PARTICLE SYSTEM v2.0 ═══════════
(function(){var c=document.getElementById("bgParticles"),ctx=c.getContext("2d"),pts=[],mx=0,my=0,tmx=0,tmy=0;function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener("resize",rs);document.addEventListener("mousemove",function(e){tmx=e.clientX;tmy=e.clientY});mx=window.innerWidth/2;my=window.innerHeight/2;tmx=mx;tmy=my;var pal=[{r:59,g:130,b:246,a:0.6},{r:99,g:102,b:241,a:0.5},{r:34,g:211,b:238,a:0.4},{r:37,g:99,b:235,a:0.45}];for(var i=0;i<100;i++){var col=pal[Math.floor(Math.random()*pal.length)];pts.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,r:Math.random()*1.3+0.2,col:col,ox:Math.random()*c.width,oy:Math.random()*c.height})}function dr(){mx+=(tmx-mx)*0.03;my+=(tmy-my)*0.03;ctx.clearRect(0,0,c.width,c.height);for(var i=0;i<pts.length;i++){var p=pts[i];var dxm=p.x-mx,dym=p.y-my,dm=Math.sqrt(dxm*dxm+dym*dym);var parallax=dm<300?(1-dm/300)*0.1:0;var nx=dm>0.1?dxm/dm:0,ny=dm>0.1?dym/dm:0;p.vx+=nx*parallax*0.02;p.vy+=ny*parallax*0.02;p.vx*=0.999;p.vy*=0.999;p.vx+=(p.ox-p.x)*0.00003;p.vy+=(p.oy-p.y)*0.00003;p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba("+p.col.r+","+p.col.g+","+p.col.b+","+p.col.a+")";ctx.fill()}for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle="rgba(79,130,210,"+(0.03*(1-dist/100))+")";ctx.lineWidth=0.25;ctx.stroke()}}}requestAnimationFrame(dr)}dr()})();
</script>
</body>
</html>
